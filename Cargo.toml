[package]
name = "tget"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
reqwest = { version = "0.13.5", features = ["json", "cookies", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
